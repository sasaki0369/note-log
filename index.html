<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noteろぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  :root{
    --paper:#F6F1E6;
    --paper-dark:#EDE5D4;
    --ink:#2E2A24;
    --ink-soft:#5B5346;
    --thread:#A6473C;
    --thread-soft:#c98077;
    --moss:#3F5C48;
    --moss-dark:#2C4634;
    --moss-soft:#DCE6DD;
    --gold:#8A6E4B;
    --line:#D8CDB6;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 39px, rgba(166,71,60,0.055) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .binding{
    position:fixed;left:0;top:0;bottom:0;width:14px;
    background:repeating-linear-gradient(180deg, var(--thread) 0 10px, var(--thread-soft) 10px 12px, transparent 12px 26px);
    opacity:.55;
    z-index:5;
  }
  header{
    padding:46px 28px 26px 52px;
    max-width:920px;margin:0 auto;
    position:relative;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.28em;color:var(--ink-soft);
    text-transform:uppercase;margin-bottom:10px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:clamp(34px,5vw,50px);
    margin:0 0 6px 0;
    letter-spacing:.02em;
    display:flex;align-items:baseline;gap:14px;
  }
  h1 .stamp-mini{
    width:44px;height:44px;border-radius:50%;
    border:2px solid var(--thread);color:var(--thread);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Zen Old Mincho',serif;font-size:15px;font-weight:700;
    transform:rotate(-8deg);
  }
  .tagline{color:var(--ink-soft);font-size:14.5px;line-height:1.8;max-width:52ch;}
  .sync-state{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--ink-soft);margin-top:10px;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#b7ac91;}
  .sync-dot.on{background:var(--moss);}
  .sync-dot.err{background:var(--thread);}

  main{max-width:920px;margin:0 auto;padding:0 28px 0 52px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:8px 0 28px 0;
    padding:16px 18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 1px 0 var(--line);
  }
  .toolbar input[type=search], .toolbar select{
    font-family:inherit;font-size:14px;
    padding:9px 12px;border:1px solid var(--line);border-radius:3px;
    background:#fff;color:var(--ink);
  }
  .toolbar input[type=search]{flex:1;min-width:160px;}
  .spacer{flex:1 1 auto;}
  .btn{
    font-family:'Zen Maru Gothic',sans-serif;font-size:13.5px;font-weight:700;
    padding:9px 16px;border-radius:3px;border:1px solid transparent;
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--moss);color:#fff;}
  .btn-primary:hover{background:var(--moss-dark);}
  .btn-ghost{background:transparent;color:var(--moss-dark);border-color:var(--moss);}
  .btn-ghost:hover{background:var(--moss-soft);}
  .btn-danger{background:transparent;color:var(--thread);border-color:var(--thread);}
  .btn-danger:hover{background:#f6e6e4;}
  .count-tag{font-size:12.5px;color:var(--ink-soft);}

  .empty{
    text-align:center;padding:70px 20px;color:var(--ink-soft);
    border:1px dashed var(--line);border-radius:4px;background:var(--card);
  }
  .empty .big{font-family:'Shippori Mincho',serif;font-size:22px;color:var(--ink);margin-bottom:8px;}

  .list{display:flex;flex-direction:column;gap:14px;margin-bottom:60px;}
  .entry-card{
    display:flex;gap:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--thread);
    border-radius:2px 6px 6px 2px;
    padding:16px 18px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease;
    position:relative;
  }
  .entry-card:hover{box-shadow:0 4px 14px rgba(46,42,36,.10);transform:translateY(-1px);}
  .stamp{
    flex:0 0 auto;
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Old Mincho',serif;font-weight:700;font-size:16px;
    transform:rotate(-6deg);
  }
  .entry-main{flex:1;min-width:0;}
  .entry-date{font-size:12px;color:var(--ink-soft);letter-spacing:.05em;margin-bottom:3px;}
  .entry-title{
    font-family:'Shippori Mincho',serif;font-size:19px;color:var(--ink);
    margin:0 0 6px 0;
  }
  .entry-snippet{
    font-size:13.5px;color:var(--ink-soft);line-height:1.7;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(46,42,36,.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px;z-index:50;overflow-y:auto;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    width:100%;max-width:680px;padding:28px 30px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    position:relative;
  }
  .modal h2{
    font-family:'Shippori Mincho',serif;font-size:22px;margin:0 0 18px 0;
    display:flex;align-items:center;gap:10px;
  }
  .modal-close{
    position:absolute;top:18px;right:20px;background:none;border:none;
    font-size:20px;color:var(--ink-soft);cursor:pointer;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.04em;}
  .field input, .field textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);
    padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:#fff;
  }
  .field textarea{resize:vertical;line-height:1.85;}
  .row2{display:flex;gap:12px;}
  .row2 > .field{flex:1;}
  .modal-body-view{
    white-space:pre-wrap;line-height:1.95;font-size:15px;color:var(--ink);
    max-height:55vh;overflow-y:auto;padding-right:6px;
    border-top:1px dashed var(--line);padding-top:16px;margin-top:4px;
  }
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .meta-line{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}

  .import-help{
    font-size:12.5px;color:var(--ink-soft);line-height:1.8;
    background:var(--moss-soft);border-radius:4px;padding:10px 12px;margin-bottom:14px;
  }
  .import-result{font-size:13px;color:var(--moss-dark);margin-top:10px;min-height:18px;}

  footer{max-width:920px;margin:0 auto;padding:20px 28px 40px 52px;color:var(--ink-soft);font-size:12px;}

  @media (max-width:600px){
    .binding{width:8px;}
    header{padding:36px 16px 20px 26px;}
    main{padding:0 16px 0 26px;}
    footer{padding:20px 16px 40px 26px;}
    .entry-card{padding:14px;}
    .stamp{width:42px;height:42px;font-size:13px;}
  }
</style>
</head>
<body>
<div class="binding"></div>

<header>
  <div class="eyebrow">Personal Note Archive</div>
  <h1><span class="stamp-mini" id="headerCount">0</span>noteろぐ</h1>
  <p class="tagline">週次で書き綴ってきた note の記事を、日付・タイトルを分けて一件ずつ記録していくログ帳です。</p>
  <div class="sync-state"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">接続中…</span></div>
</header>

<main>
  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="タイトル・本文を検索…">
    <select id="yearFilter"><option value="">すべての年</option></select>
    <span class="spacer"></span>
    <span class="count-tag" id="countTag"></span>
    <button class="btn btn-ghost" id="openImport">取り込み</button>
    <button class="btn btn-primary" id="openNew">＋ 新規記事</button>
  </div>

  <div id="listWrap"></div>
</main>

<footer>noteろぐ — 全 <span id="footCount">0</span> 件を記録中</footer>

<!-- Detail modal -->
<div class="modal-backdrop" id="detailBackdrop">
  <div class="modal">
    <button class="modal-close" data-close="detail">×</button>
    <h2><span class="stamp" id="detailStamp" style="width:36px;height:36px;font-size:13px;">1</span><span id="detailTitle"></span></h2>
    <div class="meta-line" id="detailMeta"></div>
    <div class="modal-body-view" id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn">削除</button>
      <button class="btn btn-ghost" id="editBtn">編集</button>
    </div>
  </div>
</div>

<!-- Edit / New modal -->
<div class="modal-backdrop" id="editBackdrop">
  <div class="modal">
    <button class="modal-close" data-close="edit">×</button>
    <h2 id="editHeading">記事を編集</h2>
    <div class="row2">
      <div class="field">
        <label>日付</label>
        <input type="date" id="editDate">
      </div>
      <div class="field" style="flex:2">
        <label>タイトル</label>
        <input type="text" id="editTitle" placeholder="タイトル">
      </div>
    </div>
    <div class="field">
      <label>本文</label>
      <textarea id="editBody" rows="14" placeholder="本文を入力…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="edit">キャンセル</button>
      <button class="btn btn-primary" id="saveEditBtn">保存する</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-backdrop" id="importBackdrop">
  <div class="modal">
    <button class="modal-close" data-close="import">×</button>
    <h2>過去ログを取り込み</h2>
    <div class="import-help">
      「nn.yyyymmdd_タイトル」または「yyyymmdd_タイトル」で始まる行を記事の区切りとして自動判別します。<br>
      複数記事分をまとめて貼り付けてOKです。日付・タイトルが同じ記事はあれば内容を上書き、無ければ新規追加します。
    </div>
    <div class="field">
      <textarea id="importText" rows="12" placeholder="ここに note の過去ログ本文を貼り付けてください"></textarea>
    </div>
    <div class="import-result" id="importResult"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close="import">閉じる</button>
      <button class="btn btn-primary" id="runImportBtn">取り込む</button>
    </div>
  </div>
</div>

<script>
const SEED_DATA = [{"date": "20260607", "title": "すごい娘", "body": "長女が3週間の教育実習を終えました。\n小学3年生を受け持たせてもらい、授業をするのはもちろん、その準備のために先生方の指導を受けたり、休み時間に子どもたちと遊んだり、、、最後は「研究授業」という（だったかな汗）多くの先生方の見る前で授業を行いコメントをもらう、という経験まで積んできました。\n\nそんな娘の話をときおり聞いていて、いろいろと「すごい」と感じたので、備忘の意味も含めて記録しておこうと思います。\n\nすごい①　事前準備\n毎日の授業に向けて家に帰ってきてから真剣に準備しています。\nその準備は、通り一遍のものでなく、「あの子にはこの伝え方で伝わるかな」と一人一人の顔を思い浮かべながら指導方法を考えているのです。\n僕のように、日々行き当たりばったりで仕事をしている人間からすると、想像を絶する準備です。\n\nすごい②　生活習慣\nもともと、娘はそんなに生活習慣が良い方ではありません。\nNetflixを見たり、ゲームをしたりして夜更かしすることもしばしば。\nですが、この期間は「意識高い系」の生活習慣だったように思います。\n授業の準備を終えたら23時には就寝し、朝6時頃から準備をして出ていく。\nやればできるんですね。\n\nすごい③　先生方との交流\nある夜、普段は20時には帰ってくる娘が21時を過ぎても帰ってこないので妻が心配し始めました。\n結局、22時くらいに帰ってきたのですが、聞くと、「先生たちとバドミントンしてきた」と。\n飲みにでも行っているのかと思いきや、なんて健康的！\n娘は高校の途中までバドミントンをやっていたのもあり、仲間に入れてもらったそうです。\n運動神経抜群の体育の先生にも勝ち、先生から「3週間以内に勝てるようになります！」と宣戦布告されたようですが、最終日も返り討ちにしたとのこと（笑）。\n実習終わっても絶対に来てね、と言われるほど、かわいがってもらいました。\n\nすごい④　生徒へのメッセージ\n最終日の前々日、珍しく23時過ぎまで作業をしていました。\n何をしているのか聞いたところ、約30人の生徒一人一人に手作りメッセージカードを作っている。。\n二つ折りの紙の表にかわいい絵を描き、中にびっしりコメントを書いています。\nこれは生徒たちは間違いなく嬉しい。\nその証拠に、最終日前日に渡したそのメッセージカードを、ほとんどの子たちが最終日にも持ってきてくれて、一緒に写真を撮ってくれたと。\n聞いただけで涙が出ます。\n\nすごい⑤　生徒からのメッセージ\n最終日に生徒たちからのお礼のメッセージをもらっていました。\n「世界で一番授業がわかりやすかった」\n「やさしく教えてくれてうれしかった」\n「休み時間遊んでくれてありがとう」\n「会えなくなるのがさみしい」\n「先生の授業は一生忘れません」\n3年生なのにみんないっぱい書いてくれています。\n中には「今のまま頑張れば先生になれるよ」との励ましも（笑）。\nこんなに「先生になって欲しい」と子どもたちから言われる教育実習生はいるのかな？\nまあ、みんな若い先生は好きだから言うでしょうね（苦笑）。\nでも、うまく言えないですが、メッセージに愛情がこもっているように思えました。\n\nすごい⑥　先生方からのコメント\n研究授業を見た先生方からのコメントもすごかった。\n「準備の仕方や授業の進め方などとても参考になった」\n「人柄で絶賛されている実習生はなかなかいない」\n「子ども好き好きオーラが伝わってくる」\n「言葉から笑顔が見える」\n「たまには力も抜いてね」\nなんじゃこりゃ。\nさすが言語化を専門にする先生方で、その表現もすごいが、こんなことを言われる子がうちにいるとは（笑）。\n\nすごい⑦　先生方からのプレゼント\n最終日に娘は先生方へのお礼としてお菓子を持っていきました。\nみんな喜んでくれたようですが、、、持って行った以上のお菓子やプレゼントをもらってきました。\nしかもわざわざ用意してくれていた先生も多かったようですし、手書きの手紙までくれた先生も。\nなんて温かい学校だなと思いましたし、そこに溶け込めた娘は本当に誇らしいです。\n\n親ながら、この子は先生になるために産まれてきたのではないか、と思うほどに素晴らしい先生だと思います。\nこの目で見たわけではありませんが、間違いないでしょう。\nだって、本人が悩んで、迷って、笑って、泣いて、とても充実した3週間を過ごしたのですから。\n一日たりとも行きたくないということもなく、最後の最後までとても前向きに取り組んでいました。\n\n実際 firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const recordsRef = db.ref('notelog/records');

let records = [];
let activeDetailId = null;

function parseRaw(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n');
  const patA = /^(\d{1,3})\.(\d{8})_(.+)$/;
  const patB = /^(\d{8})_(.+)$/;
  const out = [];
  let cur = null;
  for(const raw of lines){
    const line = raw.trim();
    let m = line.match(patA);
    if(m){
      if(cur) out.push(cur);
      cur = {date: m[2], title: m[3].trim(), body: []};
      continue;
    }
    m = line.match(patB);
    if(m){
      if(cur) out.push(cur);
      cur = {date: m[1], title: m[2].trim(), body: []};
      continue;
    }
    if(cur) cur.body.push(raw);
  }
  if(cur) out.push(cur);
  return out.map(r => {
    let body = r.body.join('\n');
    body = body.replace(/^\n+/, '').replace(/\n+$/, '');
    return {date: r.date, title: r.title, body};
  });
}

function toIso(yyyymmdd){
  return yyyymmdd.slice(0,4) + '-' + yyyymmdd.slice(4,6) + '-' + yyyymmdd.slice(6,8);
}

function objectToArray(obj){
  if(!obj) return [];
  return Object.keys(obj).map(id => ({
    id,
    date: obj[id].date,
    title: obj[id].title,
    body: obj[id].body || ''
  }));
}

function renumber(list){
  list.sort((a,b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
  list.forEach((r,i) => r.renban = i+1);
  return list;
}

function setSyncState(state){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.classList.remove('on','err');
  if(state === 'on'){ dot.classList.add('on'); label.textContent = 'Firebase 同期中'; }
  else if(state === 'err'){ dot.classList.add('err'); label.textContent = '同期エラー'; }
  else { label.textContent = '接続中…'; }
}

async function seedIfEmpty(){
  const snap = await recordsRef.once('value');
  if(!snap.exists()){
    const updates = {};
    SEED_DATA.forEach(r => {
      const key = recordsRef.push().key;
      updates[key] = {date: r.date, title: r.title, body: r.body};
    });
    await recordsRef.update(updates);
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function populateYearFilter(){
  const sel = document.getElementById('yearFilter');
  const years = Array.from(new Set(records.map(r => r.date.slice(0,4)))).sort().reverse();
  const cur = sel.value;
  sel.innerHTML = '<option value="">すべての年</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
  sel.value = cur;
}

function render(){
  populateYearFilter();
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const yr = document.getElementById('yearFilter').value;
  let list = records.slice().sort((a,b) => b.date.localeCompare(a.date) || b.renban - a.renban);
  if(yr) list = list.filter(r => r.date.slice(0,4) === yr);
  if(q) list = list.filter(r => (r.title + ' ' + r.body).toLowerCase().includes(q));

  document.getElementById('headerCount').textContent = records.length;
  document.getElementById('footCount').textContent = records.length;
  document.getElementById('countTag').textContent = q || yr ? `${list.length} / ${records.length} 件` : `${records.length} 件`;

  const wrap = document.getElementById('listWrap');
  if(list.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="big">まだ記事がありません</div>「＋ 新規記事」または「取り込み」から追加してください。</div>`;
    return;
  }
  wrap.innerHTML = `<div class="list">${list.map(r => `
    <div class="entry-card" data-id="${r.id}">
      <div class="stamp">${r.renban}</div>
      <div class="entry-main">
        <div class="entry-date">${toIso(r.date)}</div>
        <div class="entry-title">${escapeHtml(r.title)}</div>
        <div class="entry-snippet">${escapeHtml(r.body.slice(0,120).replace(/\n/g,' '))}</div>
      </div>
    </div>
  `).join('')}</div>`;

  wrap.querySelectorAll('.entry-card').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id));
  });

  if(activeDetailId){
    const still = records.find(x => x.id === activeDetailId);
    if(still) refreshDetailView(still);
    else closeModal('detail');
  }
}

function openDetail(id){
  const r = records.find(x => x.id === id);
  if(!r) return;
  activeDetailId = id;
  refreshDetailView(r);
  document.getElementById('detailBackdrop').classList.add('open');
}

function refreshDetailView(r){
  document.getElementById('detailStamp').textContent = r.renban;
  document.getElementById('detailTitle').textContent = r.title;
  document.getElementById('detailMeta').textContent = `${toIso(r.date)}　#${r.renban}`;
  document.getElementById('detailBody').textContent = r.body;
}

function closeModal(which){
  document.getElementById(which + 'Backdrop').classList.remove('open');
  if(which === 'detail') activeDetailId = null;
}

function openEditForm(r){
  document.getElementById('editHeading').textContent = r ? '記事を編集' : '新規記事';
  document.getElementById('editDate').value = r ? toIso(r.date) : new Date().toISOString().slice(0,10);
  document.getElementById('editTitle').value = r ? r.title : '';
  document.getElementById('editBody').value = r ? r.body : '';
  document.getElementById('editBackdrop').dataset.editingId = r ? r.id : '';
  document.getElementById('editBackdrop').classList.add('open');
}

document.getElementById('openNew').addEventListener('click', () => openEditForm(null));
document.getElementById('editBtn').addEventListener('click', () => {
  const r = records.find(x => x.id === activeDetailId);
  closeModal('detail');
  openEditForm(r);
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if(!confirm('この記事を削除しますか？この操作は取り消せません。')) return;
  const id = activeDetailId;
  closeModal('detail');
  try{
    await recordsRef.child(id).remove();
  }catch(e){
    setSyncState('err');
  }
});

document.getElementById('saveEditBtn').addEventListener('click', async () => {
  const dateVal = document.getElementById('editDate').value;
  const titleVal = document.getElementById('editTitle').value.trim();
  const bodyVal = document.getElementById('editBody').value;
  if(!dateVal || !titleVal){
    alert('日付とタイトルを入力してください');
    return;
  }
  const yyyymmdd = dateVal.replaceAll('-','');
  const editingId = document.getElementById('editBackdrop').dataset.editingId;
  try{
    if(editingId){
      await recordsRef.child(editingId).update({date: yyyymmdd, title: titleVal, body: bodyVal});
    }else{
      const key = recordsRef.push().key;
      await recordsRef.child(key).set({date: yyyymmdd, title: titleVal, body: bodyVal});
    }
    closeModal('edit');
  }catch(e){
    setSyncState('err');
    alert('保存に失敗しました。通信状態をご確認ください。');
  }
});

document.getElementById('openImport').addEventListener('click', () => {
  document.getElementById('importText').value = '';
  document.getElementById('importResult').textContent = '';
  document.getElementById('importBackdrop').classList.add('open');
});

document.getElementById('runImportBtn').addEventListener('click', async () => {
  const text = document.getElementById('importText').value;
  const parsed = parseRaw(text).filter(p => p.title && /^\d{8}$/.test(p.date));
  if(parsed.length === 0){
    document.getElementById('importResult').textContent = '記事の区切りを検出できませんでした。「yyyymmdd_タイトル」形式の行があるかご確認ください。';
    return;
  }
  let added = 0, updated = 0;
  const updates = {};
  for(const p of parsed){
    const existing = records.find(r => r.date === p.date && r.title === p.title);
    if(existing){
      updates[existing.id] = {date: p.date, title: p.title, body: p.body};
      updated++;
    }else{
      const key = recordsRef.push().key;
      updates[key] = {date: p.date, title: p.title, body: p.body};
      added++;
    }
  }
  try{
    await recordsRef.update(updates);
    document.getElementById('importResult').textContent = `取り込み完了：新規 ${added} 件、更新 ${updated} 件`;
  }catch(e){
    document.getElementById('importResult').textContent = '取り込みに失敗しました。通信状態をご確認ください。';
    setSyncState('err');
  }
});

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', (e) => { if(e.target === bd) bd.classList.remove('open'); });
});

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('yearFilter').addEventListener('change', render);

recordsRef.on('value', snap => {
  records = renumber(objectToArray(snap.val()));
  setSyncState('on');
  render();
}, err => {
  console.error(err);
  setSyncState('err');
});

(async function init(){
  try{
    await seedIfEmpty();
  }catch(e){
    console.error('seed failed', e);
    setSyncState('err');
  }
})();
</script>
</body>
</html>
